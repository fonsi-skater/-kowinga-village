<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alphonce Otieno — Personal Portfolio</title>
    <meta name="description" content="A walkable 3D village portfolio — swim, skate, garden, and meditate your way through Alphonce Otieno's story as a software engineer." />

    <!-- Open Graph tags: control how this link previews on WhatsApp,
         Facebook, LinkedIn, etc. og:image points to a file you'll need to
         add at public/og-image.png — a 1200x630px screenshot works well;
         the in-game 📸 Capture button is a quick way to generate one. -->
    <meta property="og:title" content="Alphonce Otieno — Personal Portfolio" />
    <meta property="og:description" content="A walkable 3D village portfolio — swim, skate, garden, and meditate your way through my story as a software engineer." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card tags: same idea, for X/Twitter's link preview format -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alphonce Otieno — Personal Portfolio" />
    <meta name="twitter:description" content="A walkable 3D village portfolio — swim, skate, garden, and meditate your way through my story as a software engineer." />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
